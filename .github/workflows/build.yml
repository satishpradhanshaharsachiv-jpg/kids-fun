name: Build AAB
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. कोड चेकआउट करने के लिए लेटेस्ट वर्शन (Node.js 20 एरर हटाएगा)
      - uses: actions/checkout@v5

      # 2. जावा सेटअप करने के लिए लेटेस्ट v5 वर्शन
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle सेटअप करने के लिए लेटेस्ट v5 वर्शन
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # 4. रिलीज बंडल बनाना
      - name: Build Bundle
        run: ./gradlew bundleRelease

      # 5. AAB फ़ाइल अपलोड करने के लिए लेटेस्ट वर्शन
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/bundle/release/*.aab
